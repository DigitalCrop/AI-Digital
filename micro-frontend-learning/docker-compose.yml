services:
  identity:
    build: { context: ., dockerfile: apps/mock-identity-provider/Dockerfile }
    ports: ['4001:4001']
    healthcheck:
      {
        test: ['CMD', 'wget', '-qO-', 'http://localhost:4001/health'],
        interval: 5s,
        timeout: 2s,
        retries: 10,
      }
  api:
    build: { context: ., dockerfile: apps/mock-api/Dockerfile }
    ports: ['4000:4000']
    healthcheck:
      {
        test: ['CMD', 'wget', '-qO-', 'http://localhost:4000/health'],
        interval: 5s,
        timeout: 2s,
        retries: 10,
      }
  products:
    build: { context: ., dockerfile: apps/products-app/Dockerfile }
    ports: ['3001:80']
    healthcheck:
      {
        test: ['CMD', 'wget', '-qO-', 'http://localhost/health'],
        interval: 5s,
        timeout: 2s,
        retries: 10,
      }
  orders:
    build: { context: ., dockerfile: apps/orders-app/Dockerfile }
    ports: ['3002:80']
    healthcheck:
      {
        test: ['CMD', 'wget', '-qO-', 'http://localhost/health'],
        interval: 5s,
        timeout: 2s,
        retries: 10,
      }
  shell:
    build: { context: ., dockerfile: apps/shell-app/Dockerfile }
    ports: ['3000:80']
    depends_on:
      {
        products: { condition: service_healthy },
        orders: { condition: service_healthy },
        api: { condition: service_healthy },
        identity: { condition: service_healthy },
      }
    healthcheck:
      {
        test: ['CMD', 'wget', '-qO-', 'http://localhost/health'],
        interval: 5s,
        timeout: 2s,
        retries: 10,
      }
