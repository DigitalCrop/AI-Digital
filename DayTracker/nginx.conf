server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache headers for Vite assets
    location /daytracker/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health endpoint
    location = /daytracker/health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /daytracker {
        return 301 /daytracker/;
    }

    # React/Vite SPA under /daytracker/
    location /daytracker/ {
        index index.html;
        try_files $uri $uri/ /daytracker/index.html;
    }
}
