server {
    listen 80;
    listen [::]:80;
    server_name _;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Cache headers for Vite assets
    location /DayTracker/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Health endpoint
    location = /DayTracker/health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # React/Vite SPA under /DayTracker
    location /DayTracker {
        alias /usr/share/nginx/html/DayTracker;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
