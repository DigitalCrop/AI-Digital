server {
    listen 80;
    listen [::]:80;
    server_name _;
 
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;
 
    # Cache headers for Vite assets
    location /daytracker/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
 
    # React/Vite SPA under /daytracker
    location /daytracker {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}