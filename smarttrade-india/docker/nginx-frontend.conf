server {
  listen 80;
  listen [::]:80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The shared SmartTrade gateway removes /smarttrade before forwarding.
  # Serve static assets normally and return the SPA shell for deep links.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
