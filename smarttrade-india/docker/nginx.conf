events {
  worker_connections 1024;
}

http {
  upstream backend {
    server backend:4000;
  }

  upstream frontend {
    server frontend:80;
  }

  server {
    listen 80;
    server_name localhost;

    location /smarttrade/api/ {
      rewrite ^/smarttrade/api/(.*)$ /api/$1 break;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /smarttrade/ws {
      rewrite ^/smarttrade/ws(.*)$ /ws$1 break;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
    }

    location /smarttrade/health {
      rewrite ^/smarttrade/health$ /health break;
      proxy_pass http://backend;
    }

    location /smarttrade/ {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      try_files $uri $uri/ /smarttrade/index.html;
    }
    location /smarttrade {
      return 301 /smarttrade/;
    }
  }
}
