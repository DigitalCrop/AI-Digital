version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarttrade-postgres
    environment:
      POSTGRES_USER: smarttrade
      POSTGRES_PASSWORD: smarttrade_secret
      POSTGRES_DB: smarttrade_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smarttrade -d smarttrade_db']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: smarttrade-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    image: smarttrade-backend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: smarttrade-backend
    environment:
      DATABASE_URL: postgresql://smarttrade:smarttrade_secret@postgres:5432/smarttrade_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production-change-this-to-secure-random-string-min-32-chars
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      PORT: 4000
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:3000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: smarttrade-frontend:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: smarttrade-frontend
    ports:
      - '3000:80'
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: smarttrade-nginx
    ports:
      - '${SMARTTRADE_NGINX_HOST:-127.0.0.1}:${SMARTTRADE_NGINX_PORT:-8080}:80'
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
