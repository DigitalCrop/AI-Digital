server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # Resolve application containers on the shared Docker network.
    resolver 127.0.0.11 ipv6=off valid=10s;

    location = /timepass {
        return 301 /timepass/;
    }

    # TimePass SPA, Socket.IO polling, and WebSockets.
    location ^~ /timepass/ {
        set $timepass_backend http://timepass-app:3000;
        proxy_pass $timepass_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /timepass;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 65s;
    }

    location = /smarttrade {
        return 301 /smarttrade/;
    }

    # SmartTrade frontend, API, and WebSocket gateway.
    location ^~ /smarttrade/ {
        set $smarttrade_backend http://smarttrade-india-nginx:80;
        proxy_pass $smarttrade_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /smarttrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 65s;
    }

    # Cache headers for DayTracker's Vite assets.
    location /daytracker/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /daytracker {
        return 301 /daytracker/;
    }

    # DayTracker React/Vite SPA.
    location /daytracker/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /daytracker/index.html;
    }
}
