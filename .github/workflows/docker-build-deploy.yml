name: Docker Build & Deploy DayTracker

on:
  push:
    branches: [main]
    paths:
      - 'DayTracker/**'
      - '.github/workflows/docker-build-deploy.yml'
  workflow_dispatch:

env:
  IMAGE_NAME: daytracker
  # GHCR path: ghcr.io/<owner>/<repo>
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: DayTracker

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: DayTracker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build application (CI verification)
        run: npm run build
        # No lint/test scripts in package.json yet — add npm run lint / npm test here when available

      - name: Set lowercase image owner/repo
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          IMAGE_BASE="${{ env.REGISTRY }}/${OWNER_LC}/${REPO_LC}"
          echo "image_base=${IMAGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA_SHORT}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE_BASE}:latest,${IMAGE_BASE}:${SHA_SHORT}" >> "$GITHUB_OUTPUT"
        working-directory: .

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: DayTracker
          file: DayTracker/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_base }}:latest
            ${{ steps.meta.outputs.image_base }}:${{ steps.meta.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to DigitalOcean via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          script: |
            set -euo pipefail

            IMAGE="${{ steps.meta.outputs.image_base }}:latest"
            CONTAINER_NAME="daytracker"

            # Authenticate to GHCR on the droplet (optional if image is public)
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            docker pull "${IMAGE}"

            docker stop "${CONTAINER_NAME}" || true
            docker rm "${CONTAINER_NAME}" || true

            docker run -d \
              --name "${CONTAINER_NAME}" \
              -p 80:80 \
              --restart always \
              "${IMAGE}"

            # Health check
            for i in $(seq 1 12); do
              if curl -fsS http://127.0.0.1/health >/dev/null 2>&1; then
                echo "Deploy healthy"
                docker ps --filter "name=${CONTAINER_NAME}"
                exit 0
              fi
              sleep 2
            done

            echo "Health check failed"
            docker logs --tail 50 "${CONTAINER_NAME}" || true
            exit 1
